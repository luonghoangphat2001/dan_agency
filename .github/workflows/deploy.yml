name: Build & Deploy Dan Learning (learning.hpdev.name.vn)

on:
  push:
    branches:
      - learning
  workflow_dispatch:

concurrency:
  group: deploy-hpdev-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push DockerHub & Deploy Dan Learning
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dan-learning:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dan-learning:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install dependencies & Build Vue 3 App
        run: |
          [ -f .env ] || cp .env.example .env
          npm ci --no-audit --no-fund
          npm run build
          printf '{"commit":"%s","builtAt":"%s"}\n' "${GITHUB_SHA}" "$(date -u +%FT%TZ)" > dist/version.json
          tar -czf dist.tar.gz -C dist .

      # ========================================================
      # SERVER DEPLOYMENT (learning.hpdev.name.vn) via native SSH
      # ========================================================
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload dist.tar.gz to Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp \
            -P "$SSH_PORT" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o BatchMode=yes \
            ./dist.tar.gz \
            "$SSH_USER@$SSH_HOST:/home/hpdev/learning.hpdev.name.vn/dist.tar.gz"

      - name: Deploy on Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GH_SHA: ${{ github.sha }}
          DEPLOY_SCRIPT: |
            set -e
            TARGET_DIR="/home/hpdev/learning.hpdev.name.vn"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            rm -rf "$TARGET_DIR/assets" "$TARGET_DIR/images"
            tar -xzf dist.tar.gz -C "$TARGET_DIR"
            rm -f dist.tar.gz
            grep -q "$GH_SHA" "$TARGET_DIR/version.json"
            find "$TARGET_DIR" -name '._*' -delete 2>/dev/null || true
            echo "==> [LEARNING] Deploy hoàn tất lúc $(date)!"
        run: |
          echo "$DEPLOY_SCRIPT" | ssh \
            -p "$SSH_PORT" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash

      - name: Verify production release
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://learning.hpdev.name.vn/version.json | grep -q "${GITHUB_SHA}"
          curl -fsS --retry 5 --retry-delay 3 https://learning.hpdev.name.vn/ >/dev/null
