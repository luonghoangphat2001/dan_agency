name: Deploy Dan API (api.hpdev.name.vn)

on:
  push:
    branches:
      - api
  workflow_dispatch:

concurrency:
  group: deploy-hpdev-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push DockerHub & Deploy API
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ========================================================
      # DOCKERHUB BUILD & PUSH
      # ========================================================
      - name: Set up Docker Buildx
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dan-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dan-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================
      # SERVER DEPLOYMENT (api.hpdev.name.vn) via native SSH
      # ========================================================
      - name: Package API Files
        run: |
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.github' \
              --exclude='.env' \
              --exclude='api.tar.gz' \
              -czf ../api.tar.gz .
          mv ../api.tar.gz ./api.tar.gz

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload api.tar.gz to Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp \
            -P "$SSH_PORT" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o BatchMode=yes \
            ./api.tar.gz \
            "$SSH_USER@$SSH_HOST:/home/hpdev/api.hpdev.name.vn/api.tar.gz"

      - name: Deploy & Restart on Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SCRIPT: |
            set -e
            TARGET_DIR="/home/hpdev/api.hpdev.name.vn"
            STAGING_DIR="/home/hpdev/.deploy-api-$$"
            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"
            tar -xzf "$TARGET_DIR/api.tar.gz" -C "$STAGING_DIR"
            rm -f "$TARGET_DIR/api.tar.gz"
            source /home/hpdev/nodevenv/api.hpdev.name.vn/19/bin/activate
            cp "$STAGING_DIR/package.json" "$TARGET_DIR/package.json"
            [ -f "$STAGING_DIR/package-lock.json" ] && cp "$STAGING_DIR/package-lock.json" "$TARGET_DIR/package-lock.json"
            cd "$TARGET_DIR"
            npm install --omit=dev --no-audit --no-fund
            cp -a "$STAGING_DIR/." "$TARGET_DIR/"
            rm -rf "$STAGING_DIR"
            find "$TARGET_DIR" -name '._*' -delete 2>/dev/null || true
            mkdir -p "$TARGET_DIR/tmp" && touch "$TARGET_DIR/tmp/restart.txt"
            echo "==> [API] Deploy hoàn tất lúc $(date)!"
        run: |
          echo "$DEPLOY_SCRIPT" | ssh \
            -p "$SSH_PORT" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash
